<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>1337 LogTime Counter</title>
<style>
  :root {
    color-scheme: dark;
    --border: #1c2637;
    --text: #e6ecf5;
    --muted: #8a94a6;
    --accent: #3b82f6;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 36px 20px 26px;
    background: #000;
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid;
    grid-template-rows: 1fr auto;
    gap: 20px;
  }
  .controls { display: flex; gap: 8px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 11px; font-weight: 500; color: var(--muted); }

  input,
  .datebox,
  .selectbox {
    height: 36px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: rgba(11, 18, 32, .9);
    border: 1px solid var(--border);
    border-radius: 7px;
  }
  input:focus, .datebox:focus-within { outline: 1px solid var(--accent); }
  .selectbox {
    position: relative;
    display: flex;
    align-items: center;
    width: 134px;
    padding: 0 28px 0 10px;
    cursor: pointer;
  }
  .selectbox span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .selectbox .chev { position: absolute; right: 10px; width: 12px; height: 12px; color: var(--muted); pointer-events: none; }
  input { padding: 0 10px; }

  .datebox { position: relative; display: flex; align-items: center; gap: 9px; width: 202px; padding: 0 10px; cursor: pointer; }
  .datebox .cal { width: 14px; height: 14px; flex: none; color: #7d8b9c; }
  .datebox span { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .datebox input { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; opacity: 0; pointer-events: none; }
  .datebox.open, .selectbox.open { outline: 1px solid var(--accent); }

  .calendar {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 30;
    width: 228px;
    padding: 10px;
    background: #0b1322;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .6);
  }
  .calendar.up { top: auto; bottom: calc(100% + 22px); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-size: 12px; font-weight: 600; }
  .cal-nav {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 15px;
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .cal-nav:hover { background: rgba(255, 255, 255, .07); color: var(--text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-dow { padding: 4px 0; font-size: 10px; color: var(--muted); text-align: center; }
  .cal-day {
    height: 28px;
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .cal-day:hover { background: rgba(255, 255, 255, .07); }
  .cal-day.out { color: #55617a; }
  .cal-day.today { box-shadow: inset 0 0 0 1px rgba(59, 130, 246, .55); }
  .cal-day.sel { background: var(--accent); color: #fff; font-weight: 600; }

  .menu {
    width: 100%;
    max-height: 290px;
    padding: 6px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #2f3b52 transparent;
  }
  .menu::-webkit-scrollbar { width: 8px; }
  .menu::-webkit-scrollbar-thumb { background: #2f3b52; border-radius: 4px; }
  .menu::-webkit-scrollbar-track { background: transparent; }
  .menu-item {
    display: block;
    width: 100%;
    padding: 7px 9px;
    font: inherit;
    font-size: 12px;
    text-align: left;
    color: var(--text);
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .menu-item:hover { background: rgba(255, 255, 255, .07); }
  .menu-item.sel { background: var(--accent); color: #fff; font-weight: 600; }

  main { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .number { font-size: clamp(80px, 13.75vw, 130px); font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .unit { margin-top: 8px; font-size: 13px; color: #9aa4b2; }
  .error { margin-top: 18px; font-size: 13px; color: var(--danger); max-width: 480px; white-space: pre-wrap; }

  footer { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .calc { display: flex; gap: 10px; }
  #username { width: 170px; }
  #calc {
    height: 36px;
    padding: 0 18px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 7px;
    cursor: pointer;
  }
  #calc:disabled { opacity: .6; cursor: wait; }
  .credit { font-size: 12px; color: var(--muted); }
  .credit a { color: #a78bfa; text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
  .note { font-size: 11px; color: var(--danger); }

  .media { display: flex; gap: 8px; }
  .ghost {
    height: 30px;
    padding: 0 12px;
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: rgba(11, 18, 32, .9);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
  }
  .ghost:hover { color: var(--text); border-color: #2b3a55; }

  .media-layer { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .media-layer img,
  .media-layer video { width: 100%; height: 100%; object-fit: contain; opacity: .35; }
  .hidden { display: none; }

  @media (max-width: 640px) {
    .controls { flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>
  <div class="media-layer hidden" id="mediaLayer" aria-hidden="true"></div>
  <main>
    <div class="number" id="hours">--</div>
    <div class="unit">hours</div>
    <div class="error hidden" id="error"></div>
  </main>

  <footer>
    <div class="controls">
      <div class="field">
        <label for="period">Period</label>
        <div class="selectbox" id="periodBox">
          <span id="periodText">--</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          <select id="period" class="hidden"></select>
          <div class="calendar menu hidden" id="periodMenu"></div>
        </div>
      </div>
      <div class="field">
        <label for="from">From</label>
        <div class="datebox">
          <svg class="cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="fromText">--</span>
          <input type="date" id="from" />
        </div>
      </div>
      <div class="field">
        <label for="to">To</label>
        <div class="datebox">
          <svg class="cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="toText">--</span>
          <input type="date" id="to" />
        </div>
      </div>
    </div>

    <div class="calc">
      <input id="username" autocomplete="off" spellcheck="false" list="usernames" />
      <datalist id="usernames"></datalist>
      <button id="calc">Calculate</button>
    </div>
    <div class="media">
      <input type="file" id="mediaFile" accept="image/*,video/*" class="hidden" />
      <button type="button" class="ghost" id="mediaPick">Add GIF / video</button>
      <button type="button" class="ghost hidden" id="mediaClear">Remove</button>
    </div>
    <div class="credit">Created by <a href="https://github.com/mohamedrekaze" target="_blank" rel="noreferrer">mohamedrekaze</a></div>
    <div class="note hidden" id="screenNote"></div>
  </footer>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const periodSel = $("period");
  const fromInput = $("from");
  const toInput = $("to");
  const fromText = $("fromText");
  const toText = $("toText");
  const hoursEl = $("hours");
  const errorEl = $("error");
  const usernameInput = $("username");
  const usernamesList = $("usernames");
  const calcBtn = $("calc");
  const screenNote = $("screenNote");
  const mediaLayer = $("mediaLayer");
  const mediaFile = $("mediaFile");
  const mediaPick = $("mediaPick");
  const mediaClear = $("mediaClear");

  const MONTHS = ["January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December"];
  const pad = (n) => String(n).padStart(2, "0");
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const ordinal = (n) => {
    const s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };
  const displayDate = (d) => `${MONTHS[d.getMonth()]} ${ordinal(d.getDate())}, ${d.getFullYear()}`;

  function periodLabel(ref) {
    let y = ref.getFullYear(), m = ref.getMonth();
    if (ref.getDate() >= 28) { m += 1; if (m > 11) { m = 0; y += 1; } }
    return { y, m };
  }

  // A period labelled month `m` runs from the 28th of the previous month
  // through the 27th of month `m` (e.g. October = Sept 28 -> Oct 27).
  function applyPeriod(y, m) {
    const start = new Date(y, m - 1, 28);
    const end = new Date(y, m, 27);
    fromInput.value = toISO(start);
    toInput.value = toISO(end);
    fromText.textContent = displayDate(start);
    toText.textContent = displayDate(end);
  }

  const label = periodLabel(new Date());
  for (let i = -6; i <= 6; i++) {
    const d = new Date(label.y, label.m + i, 1);
    const opt = document.createElement("option");
    opt.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    opt.textContent = MONTHS[d.getMonth()];
    periodSel.appendChild(opt);
  }
  periodSel.value = `${label.y}-${pad(label.m + 1)}`;
  applyPeriod(label.y, label.m);

  periodSel.addEventListener("change", () => {
    const parts = periodSel.value.split("-");
    applyPeriod(Number(parts[0]), Number(parts[1]) - 1);
  });

  // Themed period dropdown: the hidden <select> stays the value store.
  const periodBox = $("periodBox");
  const periodText = $("periodText");
  const periodMenu = $("periodMenu");

  function closePeriodMenu() {
    periodMenu.classList.add("hidden");
    periodBox.classList.remove("open");
  }

  function syncPeriodText() {
    const opt = periodSel.options[periodSel.selectedIndex];
    periodText.textContent = opt ? opt.textContent : "--";
  }

  periodBox.addEventListener("click", (e) => {
    if (periodMenu.contains(e.target)) return;
    if (!periodMenu.classList.contains("hidden")) return closePeriodMenu();

    periodMenu.textContent = "";
    for (const opt of periodSel.options) {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "menu-item" + (opt.value === periodSel.value ? " sel" : "");
      item.textContent = opt.textContent;
      item.addEventListener("click", () => {
        periodSel.value = opt.value;
        syncPeriodText();
        periodSel.dispatchEvent(new Event("change"));
        closePeriodMenu();
      });
      periodMenu.appendChild(item);
    }
    periodMenu.classList.remove("hidden");
    periodBox.classList.add("open");
    placePopup(periodBox, periodMenu);
    const selected = periodMenu.querySelector(".sel");
    if (selected) periodMenu.scrollTop = Math.max(0, selected.offsetTop - 8);
  });

  document.addEventListener("click", (e) => { if (!periodBox.contains(e.target)) closePeriodMenu(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePeriodMenu(); });
  syncPeriodText();

  function syncDateTexts() {
    if (fromInput.value) fromText.textContent = displayDate(new Date(fromInput.value + "T00:00:00"));
    if (toInput.value) toText.textContent = displayDate(new Date(toInput.value + "T00:00:00"));
  }
  fromInput.addEventListener("change", syncDateTexts);
  toInput.addEventListener("change", syncDateTexts);

  // Flip a popup above its box when there is not enough room below it.
  function placePopup(box, pop) {
    const rect = box.getBoundingClientRect();
    const spaceBelow = window.innerHeight - rect.bottom;
    const spaceAbove = rect.top;
    pop.classList.toggle("up", spaceBelow < pop.offsetHeight + 12 && spaceAbove > spaceBelow);
  }

  // Custom themed date picker; the hidden <input type="date"> only stores the value.
  const WEEKDAYS = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

  function createCalendar(box, input) {
    const pop = document.createElement("div");
    pop.className = "calendar hidden";
    pop.innerHTML =
      '<div class="cal-head">' +
        '<button type="button" class="cal-nav" data-step="-1" aria-label="Previous month">&#8249;</button>' +
        '<div class="cal-title"></div>' +
        '<button type="button" class="cal-nav" data-step="1" aria-label="Next month">&#8250;</button>' +
      '</div>' +
      '<div class="cal-grid"></div>';
    box.appendChild(pop);

    const title = pop.querySelector(".cal-title");
    const grid = pop.querySelector(".cal-grid");
    let view = { y: 1970, m: 0 };

    function render() {
      title.textContent = MONTHS[view.m] + " " + view.y;
      grid.textContent = "";
      for (const name of WEEKDAYS) {
        const head = document.createElement("div");
        head.className = "cal-dow";
        head.textContent = name;
        grid.appendChild(head);
      }
      const first = new Date(view.y, view.m, 1);
      const todayISO = toISO(new Date());
      for (let i = 0; i < 42; i++) {
        const date = new Date(view.y, view.m, 1 - first.getDay() + i);
        const iso = toISO(date);
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cal-day";
        cell.textContent = String(date.getDate());
        if (date.getMonth() !== view.m) cell.classList.add("out");
        if (iso === todayISO) cell.classList.add("today");
        if (iso === input.value) cell.classList.add("sel");
        cell.addEventListener("click", () => {
          input.value = iso;
          syncDateTexts();
          close();
        });
        grid.appendChild(cell);
      }
    }

    function open() {
      const base = input.value ? new Date(input.value + "T00:00:00") : new Date();
      view = { y: base.getFullYear(), m: base.getMonth() };
      render();
      pop.classList.remove("hidden");
      box.classList.add("open");
      placePopup(box, pop);
    }

    function close() {
      pop.classList.add("hidden");
      box.classList.remove("open");
    }

    pop.querySelectorAll(".cal-nav").forEach((btn) => {
      btn.addEventListener("click", () => {
        view.m += Number(btn.dataset.step);
        if (view.m < 0) { view.m = 11; view.y -= 1; }
        else if (view.m > 11) { view.m = 0; view.y += 1; }
        render();
      });
    });

    box.addEventListener("click", (e) => {
      if (pop.contains(e.target)) return;
      pop.classList.contains("hidden") ? open() : close();
    });
    document.addEventListener("click", (e) => { if (!box.contains(e.target)) close(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  }

  createCalendar(fromInput.closest(".datebox"), fromInput);
  createCalendar(toInput.closest(".datebox"), toInput);

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.remove("hidden");
  }

  function formatHours(h) {
    const n = Math.max(0, Number(h) || 0);
    return Number.isInteger(n) ? String(n) : n.toFixed(1);
  }

  const USERS_KEY = "logtime.usernames";

  function knownUsers() {
    try {
      const list = JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
      return Array.isArray(list) ? list.filter((u) => typeof u === "string" && u) : [];
    } catch (_) {
      return [];
    }
  }

  function renderUsernames(list = knownUsers()) {
    usernamesList.textContent = "";
    for (const login of list) {
      const opt = document.createElement("option");
      opt.value = login;
      usernamesList.appendChild(opt);
    }
  }

  function rememberUser(login) {
    const list = [login, ...knownUsers().filter((u) => u !== login)].slice(0, 5);
    localStorage.setItem(USERS_KEY, JSON.stringify(list));
    renderUsernames(list);
  }

  const API_URL = "https://logtime-med.1337.ma/api/get_log";

  function callApi(payload) {
    const options = {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    };
    // The API sends CORS headers, so call it directly; fall back to the
    // local proxy (server.py) if the direct call is blocked.
    return fetch(API_URL, options).catch(() => fetch("/api/get_log", options));
  }

  async function calculate() {
    const login = usernameInput.value.trim();
    const start = fromInput.value;
    const end = toInput.value;

    errorEl.classList.add("hidden");
    if (!login) return showError("Enter a username.");
    if (!start || !end) return showError("Pick a start and end date.");
    if (start > end) return showError("Start date must be before end date.");

    localStorage.setItem("logtime.username", login);
    calcBtn.disabled = true;
    calcBtn.textContent = "Calculating...";

    try {
      const res = await callApi({
        login,
        startDate: `${start}T00:00:00.000Z`,
        endDate: `${end}T23:59:59.999Z`
      });

      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);

      const members = (data && data["hydra:member"]) || [];
      if (!members.length) throw new Error("No logtime found for this user.");

      hoursEl.textContent = formatHours(members[0].totalHours);
      rememberUser(login);
    } catch (e) {
      showError(String(e.message || e));
    } finally {
      calcBtn.disabled = false;
      calcBtn.textContent = "Calculate";
    }
  }

  calcBtn.addEventListener("click", calculate);
  usernameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") calculate(); });

  let wakeLock = null;

  async function keepAwake() {
    if (!("wakeLock" in navigator)) {
      screenNote.textContent = "screen sleep not blocked: browser has no Wake Lock support";
      screenNote.classList.remove("hidden");
      return;
    }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      screenNote.classList.add("hidden");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) {
      screenNote.textContent = "screen sleep not blocked: " + (e.message || e);
      screenNote.classList.remove("hidden");
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !wakeLock) keepAwake();
  });
  document.addEventListener("pointerdown", () => { if (!wakeLock) keepAwake(); }, { once: true });
  keepAwake();

  const MEDIA_DB = "logtime-media";
  const MEDIA_TYPE = "display";

  function mediaDb() {
    return new Promise((resolve, reject) => {
      const open = indexedDB.open(MEDIA_DB, 1);
      open.onupgradeneeded = () => open.result.createObjectStore("files");
      open.onsuccess = () => resolve(open.result);
      open.onerror = () => reject(open.error);
    });
  }

  function mediaStore(mode, run) {
    return mediaDb().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction("files", mode);
      const request = run(tx.objectStore("files"));
      tx.oncomplete = () => resolve(request ? request.result : undefined);
      tx.onerror = () => reject(tx.error);
    }));
  }

  let mediaUrl = null;

  function showMedia(blob) {
    if (mediaUrl) URL.revokeObjectURL(mediaUrl);
    mediaUrl = URL.createObjectURL(blob);

    const video = blob.type.startsWith("video/");
    const el = document.createElement(video ? "video" : "img");
    if (video) {
      el.muted = true;
      el.autoplay = true;
      el.loop = true;
      el.playsInline = true;
    }
    el.src = mediaUrl;

    mediaLayer.textContent = "";
    mediaLayer.appendChild(el);
    mediaLayer.classList.remove("hidden");
    mediaClear.classList.remove("hidden");
    if (video && el.play) el.play().catch(() => {});
  }

  function clearMedia() {
    mediaLayer.textContent = "";
    mediaLayer.classList.add("hidden");
    mediaClear.classList.add("hidden");
    if (mediaUrl) {
      URL.revokeObjectURL(mediaUrl);
      mediaUrl = null;
    }
  }

  mediaPick.addEventListener("click", () => mediaFile.click());

  mediaFile.addEventListener("change", async () => {
    const file = mediaFile.files && mediaFile.files[0];
    mediaFile.value = "";
    if (!file) return;
    showMedia(file);
    try {
      await mediaStore("readwrite", (store) => store.put(file, MEDIA_TYPE));
    } catch (_) { /* keep it for this session only */ }
  });

  mediaClear.addEventListener("click", async () => {
    clearMedia();
    try {
      await mediaStore("readwrite", (store) => store.delete(MEDIA_TYPE));
    } catch (_) { /* nothing stored */ }
  });

  (async () => {
    try {
      const saved = await mediaStore("readonly", (store) => store.get(MEDIA_TYPE));
      if (saved) showMedia(saved);
    } catch (_) { /* no stored media */ }
  })();

  usernameInput.value = localStorage.getItem("logtime.username") || "";
  renderUsernames();
  if (usernameInput.value) calculate();
})();
</script>
</body>
</html>
